<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 | 邮件雷达控制台</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <section class="login-card reveal">
        <p class="eyebrow">LOCAL ACCESS</p>
        <h1>登录邮件雷达控制台</h1>
        <p class="hero-text">
          登录后才能使用垃圾邮件识别、模型重训和用户管理功能。首次启动如果还没有账号，系统会自动生成一个默认管理员。
        </p>

        <form id="login-form" class="stack-form">
          <label class="field">
            <span>用户名</span>
            <input id="login-username" type="text" autocomplete="username" placeholder="请输入用户名" />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="请输入密码" />
          </label>
          <div class="action-row">
            <button type="submit" class="primary-button" id="login-submit">进入系统</button>
            <span class="helper-text" id="login-hint">默认管理员通常是 `admin / admin123`，请登录后尽快修改。</span>
          </div>
        </form>

        <div class="login-notice" id="login-error" hidden></div>
      </section>
    </div>
    <script src="/assets/login.js"></script>
  </body>
</html>
