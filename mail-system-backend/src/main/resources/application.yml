server:
  port: 8080

spring:
  application:
    name: mail-system-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mail_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MAIL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

mail-system:
  email-domain: lmailbox.com

app:
  public-base-url: http://localhost:8080
  jwt:
    issuer: mail-system-backend
    secret: ${APP_JWT_SECRET:}
    expire-hours: 24
  ai:
    vveai-chat-url: https://api.vveai.com/v1/chat/completions
    connect-timeout-seconds: 5
    read-timeout-seconds: 20
    max-content-length: 4000
    secret-key: ${APP_AI_SECRET_KEY:}
  storage:
    root-path: D:/mail-system-storage/attachments
  data:
    initialize-demo-data: true
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:8081
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Token

spam-detector:
  enabled: true
  model-path: classpath:spam_model.json
  spam-threshold: 0.5
  top-reason-count: 5

logging:
  level:
    com.practice.mailsystem: info
