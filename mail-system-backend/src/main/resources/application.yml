server:
  port: 8080

spring:
  application:
    name: mail-system-backend
  datasource:
    url: jdbc:mysql://localhost:3306/mail_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MAIL_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false

# L 邮箱：注册与默认登录账号必须使用此后缀；修改时请同步 vue-mail-front 的 VITE_MAIL_EMAIL_DOMAIN
mail-system:
  email-domain: lmailbox.com

app:
  public-base-url: http://localhost:8080
  jwt:
    issuer: mail-system-backend
    secret: ${APP_JWT_SECRET:l-email-dev-jwt-secret-2026-safe-minimum-32}
    expire-hours: 24
  ai:
    vveai-chat-url: https://api.vveai.com/v1/chat/completions
    connect-timeout-seconds: 5
    read-timeout-seconds: 20
    max-content-length: 4000
    secret-key: ${APP_AI_SECRET_KEY:l-email-ai-secret-key-2026-32!!!}
  storage:
    root-path: D:/mail-system-storage/attachments
  data:
    initialize-demo-data: true

spam-detector:
  enabled: true
  model-path: classpath:spam_model.json
  spam-threshold: 0.5
  top-reason-count: 5

logging:
  level:
    com.practice.mailsystem: info
